[project]
name = "stepreel"
version = "0.5.1"
description = "Turn a CAD assembly (STEP) into a studio-quality exploded-view video with one command."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "bpy==5.0.1",
  "cascadio>=0.1.1",
  "numpy",
  "pillow",
  "pyyaml",
  "imageio-ffmpeg",
]

[project.scripts]
stepreel = "stepreel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stepreel"]
