name: release

# Whenever main gets a new version number (pyproject.toml), build the download
# zip (source + bundled Windows uv.exe) and publish it as GitHub Release vX.Y.Z.
# Pushes that keep the same version do nothing. Can also be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "v$VER already released"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Windows uv.exe from PyPI
        if: steps.v.outputs.skip == 'false'
        run: |
          python -m pip download uv --platform win_amd64 --only-binary=:all: --no-deps -d /tmp/uv -q
          python - <<'PY'
          import glob, zipfile, os
          z = zipfile.ZipFile(glob.glob('/tmp/uv/*.whl')[0])
          os.makedirs('bin', exist_ok=True)
          for n in z.namelist():
              if n.endswith('/uv.exe'):
                  open('bin/uv.exe', 'wb').write(z.read(n))
              if '/licenses/' in n:
                  open('licenses/uv-' + n.rsplit('/', 1)[1] + '.txt', 'wb').write(z.read(n))
          PY

      - name: Build zip
        if: steps.v.outputs.skip == 'false'
        run: |
          VER=${{ steps.v.outputs.ver }}
          mkdir -p dist/stepreel
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/stepreel/
          chmod +x dist/stepreel/start-stepreel.command
          cd dist && zip -qr "stepreel-v${VER}.zip" stepreel
          ls -la

      - name: Publish release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.v.outputs.ver }}
          python tools/release.py --notes "$VER" > notes.md
          gh release create "v$VER" "dist/stepreel-v${VER}.zip" \
            --target "$GITHUB_SHA" --title "stepreel v${VER}" --notes-file notes.md
